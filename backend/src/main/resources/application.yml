server:
  port: 8080

spring:
  application:
    name: codesystem-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/codesystem?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:codesystem_user}
    password: ${SPRING_DATASOURCE_PASSWORD:codesystem_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

gemini:
  api:
    key: ${GEMINI_API_KEY:}

jwt:
  secret: ${JWT_SECRET:codesystem_secure_jwt_signing_key_32_bytes_super_secret_for_production}
  expiration: 86400000 # 24 hours

judge:
  max-concurrent: ${JUDGE_MAX_CONCURRENT:4}
  compile-timeout-seconds: ${JUDGE_COMPILE_TIMEOUT_SECONDS:15}
  run-timeout-seconds: ${JUDGE_RUN_TIMEOUT_SECONDS:10}
  per-test-limit-ms: ${JUDGE_PER_TEST_LIMIT_MS:2500}
  python-command: ${JUDGE_PYTHON_COMMAND:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.codesystem: DEBUG
