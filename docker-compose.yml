services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: codesystem-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: codesystem
      MYSQL_USER: codesystem_user
      MYSQL_PASSWORD: codesystem_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codesystem-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/codesystem?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: codesystem_user
      SPRING_DATASOURCE_PASSWORD: codesystem_password
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-codesystem_secure_jwt_signing_key_32_bytes_super_secret_for_production}
    ports:
      - "8080:8080"

  # React Frontend (Nginx SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codesystem-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

  # Prometheus Observability Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: codesystem-prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: codesystem-grafana
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  mysql_data:
